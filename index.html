<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arendhuis Kamera-skandeerder</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,Arial,sans-serif;background:#f2f5f8;color:#183248}
header{background:#17344d;color:#fff;padding:14px;text-align:center}
main{max-width:620px;margin:auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 12px #17344d18}
h1{font-size:1.25rem;margin:0}
#status{margin:0 0 12px;padding:14px;border-radius:10px;background:#e6f2f7;text-align:center;font-weight:800}
#status.good{background:#dbf2e2}
#status.bad{background:#ffe0dc}
#reader{width:100%;overflow:hidden;border-radius:12px}
button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:9px;background:#17658a;color:#fff;font-weight:800;font-size:1rem}
.muted{color:#5d7281;font-size:.92rem;line-height:1.4}
</style>
</head>
<body>
<header><h1>Arendhuis kamera-skandeerder</h1></header>
<main>
<div class="card">
<div id="status">Kamera word voorberei…</div>
<div id="reader"></div>
<p class="muted">Rig die kamera op die leerder se QR-kode.</p>
<button id="closeBtn" type="button">Terug na Arendhuis</button>
</div>
</main>

<script>
'use strict';
const statusBox=document.getElementById('status');
const closeBtn=document.getElementById('closeBtn');
let scanner=null;
let locked=false;

function setStatus(text,cls=''){
  statusBox.textContent=text;
  statusBox.className=cls;
}
function cleanCode(value){
  return String(value||'').trim().toUpperCase().replace(/^\*|\*$/g,'');
}
async function stopScanner(){
  if(!scanner)return;
  try{await scanner.stop();}catch(e){}
}
async function onScanSuccess(decodedText){
  if(locked)return;
  const raw=String(decodedText||'').trim();
  const code=cleanCode(raw);

  if(!/^ARN-L\d{6}$/.test(code)){
    setStatus('Kode gelees, maar nie ’n geldige Arendhuis-kode nie: '+raw,'bad');
    return;
  }

  locked=true;
  if(navigator.vibrate) navigator.vibrate(120);
  setStatus('Gelees: '+code+' — stuur na Arendhuis…','good');

  if(window.opener && !window.opener.closed){
    window.opener.postMessage(
      {type:'ARENDHUIS_BARCODE',barcode:code},
      '*'
    );
    setTimeout(async()=>{
      await stopScanner();
      setStatus('Barcode gestuur: '+code+'. Tik Terug na Arendhuis.','good');
    },250);
  }else{
    setStatus('Barcode gelees: '+code+', maar die Arendhuis-blad kon nie gevind word nie.','bad');
    locked=false;
  }
}
async function start(){
  if(typeof Html5Qrcode==='undefined'){
    setStatus('Scanner-biblioteek kon nie laai nie.','bad');
    return;
  }
  scanner=new Html5Qrcode('reader',{
    formatsToSupport:[
      Html5QrcodeSupportedFormats.QR_CODE
    ],
    verbose:false
  });
  try{
    await scanner.start(
      {facingMode:'environment'},
      {
        fps:15,
        qrbox:(w,h)=>({
          width:Math.min(Math.floor(w*0.90),520),
          height:Math.min(Math.floor(h*0.70),420)
        }),
        aspectRatio:1.333333,
        disableFlip:true
      },
      onScanSuccess,
      ()=>{}
    );
    setStatus('Gereed — rig kamera op die QR-kode');
  }catch(e){
    setStatus('Kamera kon nie begin nie: '+(e&&e.message?e.message:e),'bad');
  }
}
closeBtn.addEventListener('click',async()=>{
  await stopScanner();
  try{window.close();}catch(e){}
  if(history.length>1) history.back();
});
start();
</script>
</body>
</html>
